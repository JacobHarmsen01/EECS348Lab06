<!DOCTYPE html>
<html>
<head>
    <title>Practice 3 - Password Verification</title>
    <script>
        function verifyPassword() {
            // Get values from input fields
            const pwd1 = document.getElementById("pwd1").value;
            const pwd2 = document.getElementById("pwd2").value;

            // Check length
            if (pwd1.length < 8) {
                alert("Password must be at least 8 characters long.");
                return false;
            }

            // Check if passwords match
            if (pwd1 !== pwd2) {
                alert("Passwords do not match.");
                return false;
            }

            alert("Passwords match!");
            return true;
        }
    </script>
</head>
<body>
    <h1>Practice 3 - Password Verification</h1>

    <form onsubmit="return verifyPassword()">
        <label for="pwd1">Enter password:</label><br>
        <input type="password" id="pwd1" required><br><br>

        <label for="pwd2">Re-enter password:</label><br>
        <input type="password" id="pwd2" required><br><br>

        <input type="submit" value="Verify Password">
    </form>
</body>
</html>
